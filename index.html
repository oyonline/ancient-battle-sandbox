<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>帝国亲子沙盒 · 配兵对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 战场：铺满整个视口 -->
    <div id="game-container"></div>

    <!-- 顶部悬浮状态条 -->
    <header id="topbar">
        <h1>🏰 帝国亲子沙盒</h1>
        <span id="phase-hint">配兵阶段：用金币组建你的军队</span>
        <div class="counts">
            <span class="red-c">🔴 <span id="red-count">0</span></span>
            <span class="blue-c">🔵 <span id="blue-count">0</span></span>
        </div>
        <button id="btn-mute" title="声音开关">🔊</button>
        <button id="btn-panel" title="显示/隐藏配兵面板">📜 面板</button>
    </header>

    <!-- 底部悬浮控制条 -->
    <div id="controlbar">
        <button class="ctl-btn" id="btn-pause">⏸️ 暂停</button>
        <button class="speed-btn" data-speed="0.5">🐌 0.5x</button>
        <button class="speed-btn active" data-speed="1">▶️ 1x</button>
        <button class="speed-btn" data-speed="2">🚀 2x</button>
        <button class="ctl-btn" id="btn-restart">🔄 重新开始</button>
    </div>

    <!-- 右侧浮层抽屉：配兵 / 战斗 / 结果 -->
    <aside id="side">
        <!-- 配兵面板 -->
        <div class="panel" id="buy-panel">
            <div class="team-title" id="buy-team-title">🔴 红方队长，请配兵！</div>
            <div id="unit-list"></div>
            <div id="formation-row"></div>
            <div id="budget-row">
                <div id="budget-text">🪙 剩余金币：100</div>
                <div id="budget-bar"><div id="budget-bar-fill" style="width:100%"></div></div>
            </div>
            <button class="big-btn" id="btn-lock">🔒 配好了，锁定阵容！</button>
            <div class="hint-small">克制关系：🐴骑士克🏹弓箭 · 🔱长枪克🐴骑士 · 🏹弓箭克近战</div>
        </div>

        <!-- 战斗面板 -->
        <div class="panel" id="battle-panel">
            <div class="team-title">⚔️ 大战一触即发</div>
            <div class="hint-small" style="font-size:14px">
                红蓝两军已经就位！<br><br>
                看看谁的兵种搭配更聪明：<br>
                🐴 骑士冲锋会打出双倍伤害<br>
                🔱 长枪兵站着不动就是马的噩梦<br>
                🏹 弓箭手输出高但很脆，要有人保护
            </div>
            <button class="big-btn" id="btn-start">🚀 开战！</button>
        </div>

        <!-- 结果面板 -->
        <div class="panel" id="result-panel">
            <div class="result-title" id="result-title">🎉 胜利！</div>
            <div id="result-detail"></div>
            <button class="big-btn" id="btn-again">🔁 再来一局！</button>
        </div>
    </aside>

    <!-- 轮流配兵遮罩（防偷看） -->
    <div class="overlay" id="overlay"></div>

    <script src="assets/manifest.js"></script>
    <script src="js/phaser.min.js"></script>
    <script src="js/units.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const game = new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#20415e',
            scene: IsoBattleScene,
            scale: {
                mode: Phaser.Scale.RESIZE,
                width: '100%',
                height: '100%'
            }
        });
        window.addEventListener('load', () => UI.init());
    </script>
</body>
</html>
