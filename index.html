<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>帝国亲子沙盒 · 配兵对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 战场：铺满整个视口 -->
    <div id="game-container"></div>

    <!-- 顶部悬浮状态条 -->
    <header id="topbar">
        <h1>🏰 帝国亲子沙盒</h1>
        <span id="phase-hint">第 1 步：红方队长配兵</span>
        <div class="counts">
            <span class="red-c">🔴 <span id="red-count">0</span></span>
            <span class="blue-c">🔵 <span id="blue-count">0</span></span>
        </div>
        <button id="btn-mute" title="声音开关">🔊</button>
        <button id="btn-panel" title="显示/隐藏配兵面板">📜 面板</button>
    </header>

    <!-- 底部悬浮控制条（战斗中） -->
    <div id="controlbar">
        <button class="ctl-btn" id="btn-pause">⏸️ 暂停</button>
        <button class="speed-btn" data-speed="0.5">🐌 0.5x</button>
        <button class="speed-btn active" data-speed="1">▶️ 1x</button>
        <button class="speed-btn" data-speed="2">🚀 2x</button>
        <button class="ctl-btn" id="btn-restart">🔄 重新开始</button>
    </div>

    <!-- 底部抽屉：配兵 / 就绪 / 结果 -->
    <aside id="sheet" class="open">
        <div class="sheet-inner">
            <div class="sheet-head">
                <div class="steps" id="steps">
                    <div class="step on" data-step="1"><i>1</i><span>红方配兵</span></div>
                    <div class="step" data-step="2"><i>2</i><span>蓝方配兵</span></div>
                    <div class="step" data-step="3"><i>3</i><span>开战</span></div>
                </div>
                <button id="btn-fold" title="收起/展开面板">▾</button>
            </div>

            <div class="sheet-body">
                <!-- 第1/2步：配兵 -->
                <section id="sec-buy" class="sec on">
                    <div class="team-banner" id="team-banner">🔴 红方队长，组建你的军队！</div>

                    <div class="budget-hud">
                        <div class="bh-coin"><span>🪙</span><b id="budget-left">160</b></div>
                        <div class="bh-mid">
                            <div class="bh-bar"><i id="budget-fill"></i></div>
                            <div class="bh-meta"><span id="troop-total">兵力 0</span><span>预算 160 金币</span></div>
                        </div>
                    </div>

                    <div class="preset-row">
                        <button class="preset-btn" data-preset="balance">⚖️ 均衡军团</button>
                        <button class="preset-btn" data-preset="ranged">🏹 远程火力</button>
                        <button class="preset-btn" data-preset="rush">🐴 铁骑洪流</button>
                        <button class="preset-btn ghost" id="btn-clear">🧹 清空</button>
                    </div>

                    <div id="unit-cards" class="cards"></div>

                    <div class="f-row">
                        <span class="f-label">阵型</span>
                        <div id="formation-row"></div>
                    </div>

                    <button class="big-btn red" id="btn-lock">🔒 配好了，换蓝方队长！</button>
                    <div class="hint-small">提示：可以按住 ＋ 连续加兵</div>
                </section>

                <!-- 第3步前：双方就绪 -->
                <section id="sec-ready" class="sec">
                    <div class="team-banner both">⚔️ 两军就位，大战一触即发！</div>
                    <div id="army-summary"></div>
                    <div class="hint-small">克制关系：🐴骑士克🏹弓箭手 · 🔱长枪克🐴骑士 · 🏹弓箭手克近战</div>
                    <button class="big-btn" id="btn-start">🚀 开战！</button>
                </section>

                <!-- 结果 -->
                <section id="sec-result" class="sec">
                    <div class="result-title" id="result-title">🎉 胜利！</div>
                    <div id="result-detail"></div>
                    <button class="big-btn" id="btn-again">🔁 再来一局！</button>
                </section>
            </div>
        </div>
    </aside>

    <!-- 轮流配兵遮罩（防偷看） -->
    <div class="overlay" id="overlay"></div>

    <script src="assets/manifest.js"></script>
    <script src="js/phaser.min.js"></script>
    <script src="js/units.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const game = new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#20415e',
            pixelArt: true,          // 像素风：NEAREST 硬边采样，放大不糊
            roundPixels: true,       // 像素对齐整数格，避免抖动
            antialias: false,
            scene: IsoBattleScene,
            scale: {
                mode: Phaser.Scale.RESIZE,
                width: '100%',
                height: '100%'
            }
        });
        window.addEventListener('load', () => UI.init());
    </script>
</body>
</html>
