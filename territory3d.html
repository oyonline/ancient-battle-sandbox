<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山河观战 · 地图</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: #101a23; color: #e4ecec; font: 14px/1.5 system-ui, sans-serif; }
        header { padding: 12px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
        h1 { margin: 0; font-size: 18px; }
        button { margin-left: 0; padding: 7px 14px; border: 1px solid #728a91; border-radius: 4px; background: #29434d; color: inherit; cursor: pointer; }
        .actions { margin-left: auto; display: flex; gap: 8px; }
        #battle-hud { order: 1; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; }
        .team-hud { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
        .team-hud.blue { justify-content: flex-end; text-align: right; }
        .battle-time, .ticket-group { white-space: nowrap; }
        .ticket-group { display: inline-flex; align-items: center; gap: 8px; }
        .ticket-track { display: inline-block; width: 180px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.15); overflow: hidden; }
        .ticket-track i { display: block; height: 100%; border-radius: 5px; background: #c0392b; }
        .blue .ticket-track i { background: #2e6fd0; }
        #site-detail { position: absolute; z-index: 20; left: 24px; bottom: 56px; width: 300px; background: rgba(16,24,30,0.92); border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.6; }
        .site-detail-heading { display: flex; align-items: center; gap: 10px; padding-right: 16px; margin-bottom: 8px; }
        #site-detail-title { font-size: 18px; font-weight: bold; }
        #site-detail-owner { margin-left: auto; white-space: nowrap; font-size: 12px; }
        #site-detail-close { position: absolute; top: 2px; right: 4px; padding: 0 5px; border: 0; background: transparent; font-size: 20px; }
        #capture-notices { position: absolute; z-index: 30; top: 72px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        .capture-notice { background: rgba(0,0,0,0.6); border-radius: 8px; padding: 6px 14px; font-size: 16px; font-weight: bold; white-space: nowrap; }
        .red { color: #c0392b; }
        .blue { color: #2e6fd0; }
        #victory { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: bold; background: rgba(0,0,0,0.55); border-radius: 12px; padding: 16px 32px; pointer-events: none; white-space: nowrap; }
        #viewport { position: relative; flex: 1; min-height: 0; touch-action: none; }
        .view-rotation { position: absolute; right: 24px; bottom: 24px; display: flex; gap: 10px; }
        .view-rotation button { width: 44px; height: 44px; padding: 0; border: 1px solid #728a91; border-radius: 50%; background: rgba(20,28,32,0.78); color: #e4ecec; font-size: 22px; cursor: pointer; }
        .view-rotation button:hover { background: rgba(41,67,77,0.9); }
        canvas { display: block; }
        footer { padding: 8px 18px; color: #adbec4; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
        .legend { display: inline-flex; align-items: center; gap: 5px; }
        .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <h1>山河观战 · 地图</h1>
        <div id="battle-hud" aria-live="off">开战 00:00</div>
        <label><input id="debug-toggle" type="checkbox">显示坐标调试</label>
        <div class="actions">
            <button id="pause" type="button">暂停</button>
            <button id="restart" type="button">重开一局</button>
            <button id="reset" type="button">全图复位</button>
        </div>
    </header>
    <main id="viewport" aria-label="红蓝两军领土地图" oncontextmenu="event.preventDefault()">
        <div id="capture-notices" role="status"></div>
        <section id="site-detail" aria-label="据点详情" hidden>
            <button id="site-detail-close" type="button" aria-label="关闭据点详情">×</button>
            <div class="site-detail-heading"><strong id="site-detail-title"></strong><span id="site-detail-owner"></span></div>
            <div id="site-detail-lines"></div>
        </section>
        <div class="view-rotation">
            <button id="rotate-left" type="button" aria-label="向左旋转视角">⟲</button>
            <button id="rotate-right" type="button" aria-label="向右旋转视角">⟳</button>
        </div>
    </main>
    <div id="victory" role="status" hidden></div>
    <footer>
        <span>左键拖动平移 · Ctrl/⌘+拖动、Q/E 或右下角按钮旋转 · 滚轮缩放</span>
        <span class="legend"><i class="swatch" style="background: #6f8f4e"></i>草地</span>
        <span class="legend"><i class="swatch" style="background: #2f5d34"></i>林地</span>
        <span class="legend"><i class="swatch" style="background: #8b8478"></i>岩地</span>
        <span class="legend"><i class="swatch" style="background: #3f78a8"></i>河</span>
        <span class="legend"><i class="swatch" style="background: #7fb0c4"></i>浅滩</span>
        <span class="legend"><i class="swatch" style="background: #8a6a46"></i>桥</span>
        <span class="legend"><i class="swatch" style="background: #e2cf9a"></i>道路</span>
    </footer>
    <script type="module" src="/js/territory3d/main.js"></script>
</body>
</html>
